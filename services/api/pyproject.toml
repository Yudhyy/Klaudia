[project]
name = "klaudia-api"
version = "0.1.0"
description = "Klaudia API, extraction worker, and MCP process adapters"
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.133.0",
    "fastmcp==4.0.0b3",
    "uvicorn>=0.27.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pillow>=10.0.0",
    "pypdfium2>=4.0.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.28.0",
    "groq>=0.9.0",
    "openai>=1.54.0",
    "google-genai>=1.0.0",
    "python-multipart>=0.0.9",
    "agent-core",
    "agent-skills",
    "identity-core",
    "workflow-core",
    "memory-core",
    "document-intelligence",
    "langchain-core>=1.6.0,<2.0.0",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=0.3.0",
    "toon-format @ git+https://github.com/toon-format/toon-python.git@e475c82e9da03dfaf88c0b277dee6b5d17100b13",
    "ledger-core",
    "ledger-postgres",
    "langfuse>=4.5.0",
    "blake3>=1.0.0",
    "pillow-heif>=0.18.0",
    "json-repair>=0.30.0",
    "redis[hiredis]>=5.0.0",
    "aioboto3>=13.0.0",
    "taskiq>=0.11.0",
    "taskiq-redis>=1.0.0",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
    "slowapi>=0.1.10",
    "asyncpg>=0.31.0",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.17,<2",
]
worker = [
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pillow>=10.0.0",
    "pypdfium2>=4.0.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.28.0",
    "openai>=1.54.0",
    "google-genai>=1.0.0",
    "identity-core",
    "document-intelligence",
    "ledger-core",
    "ledger-postgres",
    "langfuse>=4.5.0",
    "blake3>=1.0.0",
    "pillow-heif>=0.18.0",
    "json-repair>=0.30.0",
    "redis[hiredis]>=5.0.0",
    "aioboto3>=13.0.0",
    "taskiq>=0.11.0",
    "taskiq-redis>=1.0.0",
    "asyncpg>=0.31.0",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.17,<2",
]
mcp = [
    "ledger-core",
    "ledger-postgres",
    "fastmcp==4.0.0b3",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[tool.uv.sources]
agent-core = { workspace = true }
agent-skills = { workspace = true }
identity-core = { workspace = true }
workflow-core = { workspace = true }
memory-core = { workspace = true }
document-intelligence = { workspace = true }
ledger-core = { workspace = true }
ledger-postgres = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/klaudia_api", "src/app", "src/config"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "klaudia_api/migrations"

[tool.hatch.build.targets.sdist]
include = ["src", "migrations", "README.md", "pyproject.toml"]
