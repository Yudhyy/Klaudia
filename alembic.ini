[DEFAULT]
file_template = %%(year)d-%%(month).2d-%%(day).2d-%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC
path_separator = os
prepend_sys_path = %(here)s

[application]
script_location = %(here)s/services/api/migrations

[ledger]
script_location = %(here)s/packages/ledger-postgres/src/ledger_postgres/migrations

[post_write_hooks]
hooks = ruff
ruff.type = module
ruff.module = ruff
ruff.options = format REVISION_SCRIPT_FILENAME
