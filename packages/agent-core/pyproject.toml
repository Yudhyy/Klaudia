[project]
name = "agent-core"
version = "0.1.0"
description = "Bounded agent runtime with consumer-owned capabilities"
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["agent-skills", "langchain-core>=1.6.0,<2.0.0", "pydantic>=2.11.0"]

[tool.uv.sources]
agent-skills = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]
