[project]
name = "ledger-postgres"
version = "0.1.0"
description = "Shared PostgreSQL ledger storage and checked execution adapters"
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ledger-core",
    "asyncpg>=0.30.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.17,<2",
]

[tool.uv.sources]
ledger-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_postgres"]
