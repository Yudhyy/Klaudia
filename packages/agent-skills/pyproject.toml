[project]
name = "agent-skills"
version = "0.1.0"
description = "Versioned agent procedures and skill registry"
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_skills"]
