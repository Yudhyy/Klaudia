name: Feature Request
description: Suggest an idea or enhancement for this project
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: A clear and concise description of what the problem is (e.g., I'm always frustrated when...).
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context, examples, references, or alternatives you've considered.
    validations:
      required: false