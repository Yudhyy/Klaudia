[project]
name = "mcp-ledger"
version = "0.1.0"
description = "MCP server exposing the Google Sheets tool surface backed by Postgres"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "klaudia-api[mcp]",
    "ledger-core",
    "ledger-postgres",
    "fastmcp==4.0.0b3",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[tool.uv.sources]
klaudia-api = { workspace = true }
ledger-core = { workspace = true }
ledger-postgres = { workspace = true }

[tool.setuptools.packages.find]
include = ["ledger", "ledger.*"]
