[project]
name = "klaudia"
version = "0.1.0"
description = "Compatibility imports for the Klaudia agent packages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agent-core",
    "agent-skills",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
agent-core = { workspace = true }
agent-skills = { workspace = true }

[tool.hatch.build]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel]
only-include = ["__init__.py", "core"]
sources = { "" = "klaudia" }
