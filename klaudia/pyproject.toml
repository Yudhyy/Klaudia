[project]
name = "klaudia"
version = "0.1.0"
description = "Klaudia single accounting agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.13.0",
    "langchain-core>=1.6.0,<2.0.0",
    "langchain-google-genai>=4.0.0",
    "pydantic>=2.11.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "typing-extensions>=4.0.0",
    "langchain-openai>=0.3.0",
    "toon-format @ git+https://github.com/toon-format/toon-python.git@e475c82e9da03dfaf88c0b277dee6b5d17100b13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]
