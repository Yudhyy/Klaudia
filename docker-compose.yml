# Local infra for Klaudia development: `docker compose up -d`
# PostgreSQL, Redis, and MinIO match the defaults in config/settings.py.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: klaudia
      POSTGRES_PASSWORD: klaudia
      POSTGRES_DB: klaudia
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klaudia"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Isolated Postgres for the e2e sandbox (tests/e2e). Separate server, separate
  # volume, port 5433 — so a bench run cannot see or damage development data, and
  # the whole store can be dropped and rebuilt:
  #   docker compose --profile sandbox up -d
  #   docker compose --profile sandbox down -v   # wipe it
  # Application and ledger schemas initialise on first connection.
  postgres-sandbox:
    image: postgres:16-alpine
    profiles: ["sandbox"]
    environment:
      POSTGRES_USER: klaudia
      POSTGRES_PASSWORD: klaudia
      POSTGRES_DB: klaudia_sandbox
    ports:
      - "5433:5432"
    volumes:
      - pg-sandbox-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klaudia -d klaudia_sandbox"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional human grid UI over the ledger Postgres.
  # Start with: docker compose --profile ui up -d
  # Then add a data source in NocoDB pointing at postgres:5432/klaudia.
  nocodb:
    image: nocodb/nocodb:latest
    profiles: ["ui"]
    ports:
      - "8080:8080"
    volumes:
      - nocodb-data:/usr/app/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg-data:
  pg-sandbox-data:
  minio-data:
  nocodb-data:
