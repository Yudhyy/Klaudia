[project]
name = "klaudia-protocol"
version = "0.1.0"
description = "Agentic Accountant"
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.133.0",
    "fastmcp==4.0.0b3",
    "uvicorn>=0.27.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pillow>=10.0.0",
    "pypdfium2>=4.0.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.28.0",
    "groq>=0.9.0",
    "openai>=1.54.0",
    "google-genai>=1.0.0",
    "python-multipart>=0.0.9",
    "klaudia",
    "agent-core",
    "agent-skills",
    "langchain-core>=1.6.0,<2.0.0",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=0.3.0",
    "toon-format @ git+https://github.com/toon-format/toon-python.git@e475c82e9da03dfaf88c0b277dee6b5d17100b13",
    "ledger-core",
    "mcp-ledger",
    "langfuse>=4.5.0",
    "blake3>=1.0.0",
    "pillow-heif>=0.18.0",
    "json-repair>=0.30.0",
    "redis[hiredis]>=5.0.0",
    "aioboto3>=13.0.0",
    "taskiq>=0.11.0",
    "taskiq-redis>=1.0.0",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
    "slowapi>=0.1.10",
    "asyncpg>=0.31.0",
]

[tool.uv.sources]
klaudia = { workspace = true }
agent-core = { workspace = true }
agent-skills = { workspace = true }
ledger-core = { workspace = true }
mcp-ledger = { workspace = true }

[tool.uv.workspace]
members = [
    "klaudia",
    "mcp-ledger",
    "packages/ledger-core",
    "packages/agent-core",
    "packages/agent-skills",
]

[tool.uv]
constraint-dependencies = ["fastmcp-slim==4.0.0b3"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
