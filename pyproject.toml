[project]
name = "klaudia-protocol"
version = "0.1.0"
description = "Agentic Accountant"
license = "AGPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "klaudia-api[api,worker,mcp]",
    "klaudia",
    "mcp-ledger",
]

[tool.uv.sources]
klaudia-api = { workspace = true }
klaudia = { workspace = true }
agent-core = { workspace = true }
agent-skills = { workspace = true }
identity-core = { workspace = true }
workflow-core = { workspace = true }
memory-core = { workspace = true }
document-intelligence = { workspace = true }
ledger-core = { workspace = true }
ledger-postgres = { workspace = true }
mcp-ledger = { workspace = true }

[tool.uv.workspace]
members = [
    "services/api",
    "klaudia",
    "mcp-ledger",
    "packages/ledger-core",
    "packages/ledger-postgres",
    "packages/agent-core",
    "packages/agent-skills",
    "packages/identity-core",
    "packages/workflow-core",
    "packages/memory-core",
    "packages/document-intelligence",
]

[tool.uv]
constraint-dependencies = ["fastmcp-slim==4.0.0b3"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
