version: 2.1

parameters:
  run_backend:
    type: boolean
    default: false
  run_mobile:
    type: boolean
    default: false
  run_full:
    type: boolean
    default: false

executors:
  python:
    docker:
      - image: cimg/python:3.11
  python-with-services:
    docker:
      - image: cimg/python:3.11

      - image: cimg/redis:7.2

      # RustFS provides the S3-compatible service.
      - image: rustfs/rustfs:1.0.0
        environment:
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: "0.0.0.0:9000"
          RUSTFS_ACCESS_KEY: minioadmin
          RUSTFS_SECRET_KEY: minioadmin

      - image: cimg/postgres:16.4
        environment:
          POSTGRES_USER: klaudia
          POSTGRES_PASSWORD: klaudia
          POSTGRES_DB: klaudia

commands:
  install-deps:
    description: Install uv and sync all workspace packages
    steps:
      - restore_cache:
          keys:
            - uv-cache-v1-{{ checksum "uv.lock" }}
            - uv-cache-v1-
      - run:
          name: Install uv
          command: pip install uv
      - run:
          name: Sync dependencies
          command: uv sync --all-packages --group dev
      - save_cache:
          key: uv-cache-v1-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv

jobs:
  lint:
    executor: python
    steps:
      - checkout
      - install-deps
      - run:
          name: Ruff check
          command: uv run ruff check app/ klaudia/ config/ mcp-ledger/ tests/
      - run:
          name: Ruff format check
          command: uv run ruff format --check app/ klaudia/ config/ mcp-ledger/ tests/

  unit-test:
    executor: python
    steps:
      - checkout
      - install-deps
      - run:
          name: Run unit tests
          command: uv run pytest tests/unit -q --junitxml=test-results/unit.xml
      - store_test_results:
          path: test-results

  integration-test:
    executor: python-with-services
    environment:
      MOCK_KIE: "true"
      LANGFUSE_ENABLED: "false"
      DATABASE_URL: postgresql://klaudia:klaudia@127.0.0.1:5432/klaudia
      PG_TEST_URL: postgresql://klaudia:klaudia@127.0.0.1:5432/klaudia
      JWT_SECRET: test-secret-that-is-at-least-32-bytes-long
    steps:
      - checkout
      - install-deps
      - run:
          name: Wait for Redis, S3, and Postgres
          command: |
            for i in $(seq 1 60); do
              if curl -fsS \
                  http://127.0.0.1:9000/health \
                  > /dev/null \
                && (echo PING | nc -w 1 127.0.0.1 6379 | grep -q PONG) \
                && nc -z 127.0.0.1 5432; then
                echo "services up"
                exit 0
              fi
              sleep 1
            done
            echo "services did not come up" >&2
            exit 1
      - run:
          name: Run API, financial core, and service integration tests (mock KIE)
          command: >
            uv run pytest
            tests/integration/api
            tests/integration/extraction/test_ingest_pipeline.py
            tests/integration/extraction/test_async_pipeline.py
            tests/integration/database
            tests/integration/mcp-ledger
            -q --junitxml=test-results/integration.xml
      - store_test_results:
          path: test-results

  mobile-checks:
    docker:
      - image: cimg/node:24.12.0
    resource_class: small
    working_directory: ~/project
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-cache-v1-{{ arch }}-{{ checksum "apps/mobile/package-lock.json" }}
            - npm-cache-v1-{{ arch }}-
      - run:
          name: Install mobile dependencies
          working_directory: ~/project/apps/mobile
          command: npm ci
      - save_cache:
          key: npm-cache-v1-{{ arch }}-{{ checksum "apps/mobile/package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Check mobile types
          working_directory: ~/project/apps/mobile
          command: npm run typecheck
      - run:
          name: Test mobile services
          working_directory: ~/project/apps/mobile
          command: npm test

  no-code-change:
    docker:
      - image: cimg/base:stable
    steps:
      - run: echo "No code checks are needed for these paths."

workflows:
  backend:
    when: pipeline.git.branch == "main" or pipeline.git.branch == "development" or pipeline.parameters.run_backend or pipeline.parameters.run_full
    jobs:
      - lint
      - unit-test:
          requires:
            - lint
      - integration-test:
          requires:
            - unit-test

  mobile:
    when: pipeline.git.branch == "main" or pipeline.git.branch == "development" or pipeline.parameters.run_mobile or pipeline.parameters.run_full
    jobs:
      - mobile-checks

  no-code:
    unless: pipeline.git.branch == "main" or pipeline.git.branch == "development" or pipeline.parameters.run_backend or pipeline.parameters.run_mobile or pipeline.parameters.run_full
    jobs:
      - no-code-change
