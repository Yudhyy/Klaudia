version: 2.1
setup: true

orbs:
  path-filtering: circleci/path-filtering@3.0.0

workflows:
  select-checks:
    jobs:
      - path-filtering/filter:
          base-revision: development
          config-path: .circleci/continue.yml
          # Unmapped paths run both, except documentation and licences.
          mapping: |
            ^apps/mobile/.*$ run_mobile true
            ^(app|klaudia|mcp-ledger|packages/(ledger-core|ledger-postgres|agent-core|agent-skills|identity-core|workflow-core|memory-core)|config|tests|sample-data)/.*$ run_backend true
            ^(pyproject\.toml|uv\.lock|alembic\.ini)$ run_backend true
            ^(\.circleci|\.github|scripts)/.*$ run_full true
            ^(?!(apps/mobile/|app/|klaudia/|mcp-ledger/|packages/(ledger-core|ledger-postgres|agent-core|agent-skills|identity-core|workflow-core|memory-core)/|config/|tests/|sample-data/|docs/|\.circleci/|\.github/|scripts/|pyproject\.toml$|uv\.lock$|alembic\.ini$|README\.md$|LICENSE(\.md)?$)).+$ run_full true
